name: Publish ocean data

# Two cadences, one workflow.
#
# **:05 is the full run** — offset from the hour because scheduled runs bunch
# up at :00, and ahead of the site's own deploy at :17 so a site build finds
# fresh data waiting rather than racing this one.
#
# **:25 and :45 refresh the storms and the platforms only.** The NHC does not
# publish on our schedule: an advisory every three hours, every two once
# watches or warnings are up, and a special advisory or outlook whenever a
# forecaster judges one is needed. Against an hourly publish that is up to an
# hour of avoidable lag on the one product here that is read while it matters.
# Three deploys an hour instead of one; it is a *cost* decision rather than a
# physical one, so it is one cron line to change if that is the wrong trade.
#
# **What these times are not is when the runs happen.** GitHub queues
# scheduled workflows and dispatches them late — measured over fourteen
# consecutive runs of this repository on 2026-08-12, between **19 and 37
# minutes** after the nominal time, median about 27. So the three crons buy
# three publishes an hour rather than three *evenly spaced* publishes an hour:
# the delay is applied per run and varies, so two can land close together and
# the gap either side of them stretches. The average staleness still falls by
# roughly the factor the count suggests, which is the whole of what this is
# for — but nothing downstream should be written as though a publish lands at
# :25.
#
# A light run skips every model fetch: no HYCOM, no ECMWF, no tile builds. It
# seeds the rest of the tree from the last publish exactly as the full run
# already does for an outage, so what it deploys is this hour's ocean with a
# fresher set of storms on top. See `light` below.
on:
  schedule:
    - cron: '5 * * * *'
    - cron: '25,45 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# No `contents: write`. Nothing here commits, and the token should not be able
# to: the whole reason this repository exists is that its history does not grow.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # This repository first, and first for a reason: actions/checkout
      # cleans its destination, so taking the root after site/ would wipe it.
      - name: Check out this repository
        uses: actions/checkout@v4

      # The pipelines live in the site repository, so there is one copy of
      # them and one contract. Pinned to a branch rather than vendored: a
      # vendored copy drifts, and the failure when it does is a published
      # file that no longer matches what the map expects to read.
      - name: Check out the pipelines
        uses: actions/checkout@v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Which kind of run this is, decided once and read by every step below.
      #
      # **`github.event.schedule` is the literal cron string**, so the two
      # entries above are what distinguishes them — there is no other signal,
      # and a `workflow_dispatch` or a push carries none at all. Those default
      # to a **full** run, which is the safe direction: a manual run is almost
      # always somebody checking that the whole thing still works, and a light
      # run that was meant to be full publishes a tree an hour older than the
      # operator expected with nothing saying so.
      - name: Decide what kind of run this is
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "25,45 * * * *" ]; then
            echo "light=true" >> "$GITHUB_OUTPUT"
            echo "A light run: storms and platforms only, everything else seeded."
          else
            echo "light=false" >> "$GITHUB_OUTPUT"
            echo "A full run: every pipeline."
          fi

      # Seed with what is already published, and this is not an optimisation.
      #
      # Every pipeline degrades an upstream outage into stale data by keeping
      # the file it wrote last time — "keeping the previous fields", "keeping
      # previous asset positions". That depended on a snapshot committed in
      # the site repository, and moving the data here removed it: a clean
      # checkout has no previous anything, so the fallbacks became no-ops the
      # day this repository started. An outage would blank a layer instead of
      # ageing it, which is the failure those guards exist to prevent.
      #
      # So the last publish is downloaded back over the empty directory
      # first. Best effort: on the very first run there is nothing to fetch
      # and the pipelines simply start cold, which is correct.
      - name: Seed from the last publish
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p site/public/map
          base=https://oceansensing.org/ocean-data-repo/map
          got=0
          # **The roots only — everything else is seeded from what these
          # advertise**, by the step below. A hand-kept list of every
          # published file is a list that falls behind its siblings, and it
          # had: `sic-oisst.json` was never on it, so when PSL answered a
          # rate limit the product had no previous file to keep and 404'd
          # instead. The map offered "SIC (OISST)" against a file that had
          # never existed, on every run since it was added, with a green
          # deploy each time. A root is a file nothing else links to.
          for f in ocean-assets.json argo.json \
                   currents.json currents-60m.json \
                   sst-oisst.json sic-oisst.json \
                   sst-navy.json sss-navy.json sic-navy.json sit-navy.json \
                   wind.json air.json waves.json \
                   wsp34.json wsp50.json wsp64.json; do
            if curl -fsS --max-time 120 "$base/$f" -o "site/public/map/$f"; then
              got=$((got + 1))
            else
              rm -f "site/public/map/$f"
            fi
          done
          echo "seeded $got files from the previous publish"


      # The exception to "no Python dependencies", and it is the format
      # rather than the effort: ECMWF packs its open GRIB2 with CCSDS/AEC
      # (data representation template 5.42), which nothing in the standard
      # library can decode. eccodes ships binary wheels with the library
      # bundled, so this is a pip install and not an apt one. Every other
      # pipeline below still needs nothing.
      # A light run calls neither ECMWF pipeline, so it needs neither the
      # install nor the ~40 s it takes.
      - name: Install the ECMWF pipelines' dependency
        if: steps.mode.outputs.light != 'true'
        run: pip install -r site/scripts/requirements-wind.txt

      # Standard library only, by design — see the header of each script.
      - name: Storms, saildrones, gliders, Argo
        working-directory: site
        run: python3 scripts/fetch-ocean-assets.py

      - name: Currents, surface and 60 m
        if: steps.mode.outputs.light != 'true'
        working-directory: site
        run: python3 scripts/fetch-currents.py

      - name: Sea-surface temperature and salinity
        if: steps.mode.outputs.light != 'true'
        working-directory: site
        run: python3 scripts/fetch-ocean-fields.py

      # ECMWF publishes four runs a day and lands them within hours, so
      # unlike the ESPC fields this one is a nowcast: the step nearest now,
      # off the freshest run that has published it. Nothing to cache — the
      # two files change every run. They are the model's own 0.25 degrees
      # globally, so they are the largest single grids published here at
      # 9 MB of wind and 5 MB of air temperature, and each is fetched only
      # by a reader who switches that layer on.
      - name: 10 m wind and 2 m air temperature
        if: steps.mode.outputs.light != 'true'
        working-directory: site
        run: python3 scripts/fetch-wind.py

      # ECWAM is ECMWF's wave model, run beside the IFS above — but published
      # into its own stream, with its own index and its own GRIB, so it is a
      # second script rather than two more range reads into the first. It
      # needs no install of its own: the requirements above already carry
      # eccodes, which is the only thing either script wants.
      #
      # Masked to the ocean, unlike the two atmospheric fields, because there
      # are no waves on land — so it is 4.4 MB where the air temperature is 5,
      # and like both of those it is fetched only by a reader who switches
      # the layer on. Nothing to cache: the file changes every run.
      - name: Significant wave height
        if: steps.mode.outputs.light != 'true'
        working-directory: site
        run: python3 scripts/fetch-waves.py

      # Anything the roots advertise that is not on disk: regional grids,
      # forecast frames, and each frame's own regions.
      #
      # **After the pipelines, not before, and that is what makes it free.**
      # As a pre-seed it downloaded every advertised file on every run and
      # the pipelines then overwrote almost all of them — measured against
      # the live site, 58.6 MB pulled where the roots alone are 7.9 MB. Run
      # here it fetches nothing at all on a healthy run, because everything
      # advertised has just been written, and it fetches exactly the gaps
      # when a product fails. The roots still seed *before* the pipelines:
      # a root is what keeps a failed product on the map at all, and it is
      # also what this reads to know which links to check.
      #
      # **Two reasons this is a walk rather than a list.** A non-base frame is
      # named for its lead, and the lead moves with the run's lateness, so
      # there is no fixed name to write down. And a list of the *fixed* names
      # is a list that falls behind: the Southern Ocean currents band was
      # added upstream and nothing here knew, exactly as `sic-oisst.json` was
      # added and nothing here knew.
      #
      # Left unseeded, an outage keeps a previous root that advertises links
      # to files not on disk — the map offering an hour, or a region, whose
      # grid 404s.
      - name: Backfill anything advertised but missing
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          BASE = 'https://oceansensing.org/ocean-data-repo/map'
          d = pathlib.Path('site/public/map')

          def grab(name):
              """Fetch one published file, returning its header or None."""
              try:
                  with urllib.request.urlopen(f'{BASE}/{name}', timeout=120) as r:
                      body = r.read()
              except Exception as exc:
                  print(f'  no previous {name} ({exc})')
                  return None
              (d / name).write_bytes(body)
              doc = json.loads(body)
              return (doc[0] if isinstance(doc, list) else doc)['header']

          def header_of(doc):
              """A velocity file is a two-element array; a scalar is an object.

              Both carry the same header, and getting this wrong is how a
              field's regions would be silently skipped while the currents'
              were seeded.
              """
              return (doc[0] if isinstance(doc, list) else doc)['header']

          def links(head):
              for d_ in head.get('details', []):
                  yield d_['url'].rsplit('/', 1)[-1]
              for f_ in head.get('forecast', []):
                  yield f_['url'].rsplit('/', 1)[-1]

          # **What is on disk, not what the loop has visited.** Tracking the
          # latter re-fetched six files that were already there, because the
          # walk is alphabetical and `currents-60m.json` sorts before the
          # regions it links to. Harmless while this ran before the pipelines;
          # here it would have overwritten a freshly built grid with the
          # previous publish's copy — a stale region under a current global,
          # which is the one thing the whole seeding arrangement exists to
          # avoid.
          tried = set()

          def missing(name):
              """Fetch a link only if the pipelines did not already write it."""
              if name in tried or (d / name).exists():
                  return None
              tried.add(name)
              return grab(name)

          got = 0
          for stem in sorted(f.name for f in d.glob('*.json')):
              try:
                  head = header_of(json.loads((d / stem).read_text()))
              except Exception:
                  continue          # ocean-assets and argo carry no header
              for name in links(head):
                  # The frame or region first, then whatever *it* advertises:
                  # a frame's regions carry its lead in their names, so only
                  # the frame's own header knows them.
                  sub = missing(name)
                  if not sub:
                      continue
                  got += 1
                  for deeper in links(sub):
                      if missing(deeper):
                          got += 1
          print(f'backfilled {got} advertised file(s) the pipelines did not write')
          PY

      # What the tiles contain, as a cache key: the model run **and every
      # valid time built from it**.
      #
      # The run alone was enough while the step was pinned to a fixed lead,
      # because then one run meant one hour. Both pipelines now choose their
      # step by valid time, snapped to a six-hour boundary, so the step moves
      # four times a day *within* a single run — and a run-only key would hit
      # on every one of those, skip the build, and publish the previous
      # window's tiles under the new hour's header. The right run, the wrong
      # hour, and nothing on screen to say so.
      #
      # Each pipeline answers for its own tiles. The field key used to be the
      # currents' run, which held while both were pinned to the same lead;
      # a key describing some other build's contents is the same failure with
      # an extra layer of indirection.
      #
      # Both flags print progress to stderr, so stdout is only ever the key.
      # **A light run still restores the tiles; it only skips building
      # them.** Pages replaces the whole site on every deploy, so a tree
      # assembled without them is a tree where every reader past zoom 4
      # silently drops to the coarse grid. The probe is a HYCOM read of
      # about 1.5 s and it is what produces the cache key, so it runs in
      # both modes — the cheap half of the tile machinery, not the
      # expensive one.
      - name: Identify what the tiles will contain
        id: model
        working-directory: site
        run: |
          echo "run=$(python3 scripts/fetch-currents.py --run)" >> "$GITHUB_OUTPUT"
          echo "currents=$(python3 scripts/fetch-currents.py --tile-key)" >> "$GITHUB_OUTPUT"
          echo "fields=$(python3 scripts/fetch-ocean-fields.py --tile-key)" >> "$GITHUB_OUTPUT"

      - name: Restore current tiles
        id: tiles
        uses: actions/cache@v4
        with:
          # Globs, because the non-base frame's directory is named for its
          # lead and the lead now moves with the run's lateness — there is no
          # fixed name to list. Without them the second frame's tiles are
          # rebuilt from HYCOM every window however well the cache hits.
          path: |
            site/public/map/tiles
            site/public/map/tiles-60m
            site/public/map/tiles-f*h
            site/public/map/tiles-60m-f*h
          # v4: the key names the run and every valid time built from it, and
          # the currents publish two frames per window rather than one. A v3
          # hit would restore a single frame's tiles under a header that
          # advertises two, so the forecast control would offer an hour whose
          # tiles 404 and the map would quietly fall back to the coarse grid.
          #
          # v3: leads are counted from the model run now, so the *same* run
          # builds T+36 where it used to build T+0. The key named the run and
          # nothing else, so a v2 hit would restore a nowcast tile set and
          # publish it under a forecast header. The cache is an input to what
          # gets served, not just a time saver, so a change in what the tiles
          # *contain* has to move the key.
          #
          # v5: the tile tier starts at zoom 5 rather than 7. That changes no
          # tile — only `index.json`, which the cache restores along with
          # them — so a v4 hit would republish an index still advertising
          # minZoom 7 and the map would go on drawing the coarse grid at the
          # zooms this was meant to fix. Silently, and until the next model
          # run. The same trap the fields' own key already carries a note
          # about: what has to move the key is anything that changes what is
          # *served*, and the index is served.
          key: currents-tiles-v5-${{ steps.model.outputs.currents }}
          # **A light run takes the newest tiles it can get; a full run takes
          # an exact match or builds.** The difference is what each is holding
          # them against. A full run has just fetched a fresh grid, so a
          # near-miss set belongs to some other hour and rebuilding is the
          # point. A light run fetched no grid at all — the ones on disk are
          # the previous publish's, seeded — so the newest cached tiles are
          # exactly the tiles those grids were published with.
          #
          # Scoped rather than set for both, because a prefix restore reports
          # `cache-hit: false`: on a full run that would leave a stale set on
          # disk *and* build over it, and only the directories the build
          # writes get overwritten — a lead that had since moved would keep
          # its old directory and be published beside the new one.
          restore-keys: ${{ steps.mode.outputs.light == 'true' && 'currents-tiles-v5-' || '' }}

      - name: Build current tiles
        if: steps.mode.outputs.light != 'true'
          && steps.model.outputs.run != '' && steps.tiles.outputs.cache-hit != 'true'
        working-directory: site
        run: python3 scripts/fetch-currents.py --tiles

      - name: Restore field tiles
        id: fieldtiles
        uses: actions/cache@v4
        with:
          path: |
            site/public/map/tiles-sst-navy
            site/public/map/tiles-sss-navy
            site/public/map/tiles-sic-navy
            site/public/map/tiles-sit-navy
          # v6: the fields choose their step by valid time now, so their key
          # is their own — `fetch-ocean-fields.py --tile-key`, naming every
          # tiled product's run and hour — rather than the currents' run. It
          # moves four times a day instead of once, which is the cost of the
          # tiles being the hour the grids are.
          #
          # v5: ice thickness is a fourth tile set, and it replaced the ice
          # edge — which was a contour, published as one file and never
          # cached, so nothing has to be removed here. The v4 note below
          # applies verbatim: a path missing the new directory never saves
          # it, and a key that does not move means the previous entry hits,
          # the build is skipped, and the run publishes without it.
          #
          # v4: sea ice concentration is a third tile set, and both halves of
          # this had to change together. A path that does not list it means
          # the ice tiles are never saved; a key that does not move means the
          # v3 entry *hits*, the build step is skipped entirely, and the run
          # publishes the two tile sets it restored with the third silently
          # absent — the map then quietly falls back to the coarse region
          # grid for ice and says nothing. Same reasoning as v3 below: the
          # cache is an input to what gets served, so a change in what the
          # tiles contain has to move the key.
          key: field-tiles-v6-${{ steps.model.outputs.fields }}
          # Same argument as the currents' above.
          restore-keys: ${{ steps.mode.outputs.light == 'true' && 'field-tiles-v6-' || '' }}

      - name: Build field tiles
        if: steps.mode.outputs.light != 'true'
          && steps.model.outputs.fields != '' && steps.fieldtiles.outputs.cache-hit != 'true'
        working-directory: site
        run: python3 scripts/fetch-ocean-fields.py --tiles

      # The gate. The map reads these files against schema.ts, and a shape
      # that drifts shows up as a blank or wrong layer rather than an error —
      # so nothing publishes unless the contract holds.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the data against the published contract
        working-directory: site
        run: node scripts/test-schema.mjs

      # Assemble what actually gets served. `map/` at the root, so a consumer
      # points dataBase at <pages url>/map/ and every path inside the files
      # resolves the way it always has.
      # Two halves, and the order is deliberate. The committed half first —
      # the seafloor and the shorelines, which do not change and cannot be
      # rebuilt in CI anyway (the isobaths need a 7.5 GB GEBCO grid) — then
      # the fetched half over the top. Fetched wins on any collision, which is
      # what makes a stale committed copy harmless rather than sticky.
      # **A light run must never publish a tree with no tiles in it**, and
      # without this it could. Pages replaces the whole site on every deploy,
      # so the tiles are not "kept" between publishes — they are re-uploaded
      # every time, out of whatever the cache restored. A light run does not
      # build them, so if the cache misses entirely there is nothing on disk
      # and the deploy would quietly drop ~500 MB of tiles: every reader past
      # zoom 4 falls back to the coarse grid, with no error anywhere.
      #
      # The prefix restore above makes a total miss unlikely rather than
      # impossible — a brand new cache generation, an eviction, a first run
      # after a key version bump. So the light run checks, and **skips its own
      # deploy** rather than publishing the gap. Nothing is lost by skipping:
      # the previous publish stays up, the storms are then up to another
      # twenty minutes old, and the full run at :05 rebuilds regardless.
      #
      # A full run is deliberately not gated on this. It builds what it does
      # not restore, so an empty directory there means the build failed, and
      # the pipelines already fail the run for that — a second guard would
      # only mask which one spoke first.
      - name: Refuse to publish a light run with no tiles
        id: gap
        run: |
          set -uo pipefail
          publish=true
          if [ "${{ steps.mode.outputs.light }}" = "true" ]; then
            for d in tiles tiles-60m tiles-sst-navy; do
              if [ ! -d "site/public/map/$d" ] || [ -z "$(ls -A "site/public/map/$d" 2>/dev/null)" ]; then
                echo "::warning::$d is empty — skipping this light publish rather than"
                echo "::warning::deploying a tree without it. The :05 run rebuilds."
                publish=false
              fi
            done
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publishing: $publish"

      - name: Assemble the site
        if: steps.gap.outputs.publish == 'true'
        run: |
          mkdir -p out/map
          cp -r map/. out/map/
          cp -r site/public/map/. out/map/
          # Pages runs Jekyll otherwise, which would ignore anything starting
          # with an underscore and slow the upload down for no reason.
          touch out/.nojekyll
          cp README.md out/index.md
          du -sh out out/map
          find out -name index.json | wc -l | xargs echo "tile indexes:"

      - uses: actions/configure-pages@v5
        if: steps.gap.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gap.outputs.publish == 'true'
        with:
          path: out
      - id: deploy
        if: steps.gap.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
